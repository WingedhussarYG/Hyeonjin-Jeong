name: Withdraw game downloads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-lucid-games.yml']
permissions:
  contents: write
concurrency:
  group: lucid-game-collection
  cancel-in-progress: false
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Withdraw game releases while preserving recovery copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("lucid-games-")) | select(.draft == false) | .id' > "$RUNNER_TEMP/game-releases"
          while read -r id; do
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true --silent
          done < "$RUNNER_TEMP/game-releases"
