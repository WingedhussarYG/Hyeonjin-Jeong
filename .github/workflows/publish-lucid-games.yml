name: Publish verified Lucid Games collection
on:
  push:
    branches: [main]
    paths: ['lucid-games/release.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: lucid-game-collection
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lucid-games/publish.py
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json;print(json.load(open("lucid-games/release.json"))["tag"])')"
          [[ "$tag" =~ ^lucid-games-[a-zA-Z0-9.-]+$ ]]
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Lucid Games collection" --notes-file lucid-games/README.md artifacts/*
          gh release edit "$tag" --draft=false
