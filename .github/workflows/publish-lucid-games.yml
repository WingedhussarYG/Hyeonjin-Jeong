name: Publish verified Lucid Games collection
on:
  push:
    branches: [main]
    paths: ['lucid-games/release.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: lucid-game-collection
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lucid-games/publish.py
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json;print(json.load(open("lucid-games/release.json"))["tag"])')"
          [[ "$tag" =~ ^lucid-games-[a-zA-Z0-9.-]+$ ]]
          title="Lucid Games collection"
          notes=lucid-games/README.md
          if [[ "$tag" = lucid-games-2026.11.27-galactic252 || "$tag" = lucid-games-2026.11.27-v15 ]]; then
            title="Lucid Games collection · Galactic Realms 2.5.2"
            notes=lucid-games/updates/galactic-2.5.2.md
            for i in $(seq 1 120); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45999852580" --jq '(.head_sha + " " + .status + " " + (.conclusion // "pending"))')
              case "$state" in
                "b03680178b0e6bfe26fe91dcae81cf1a097a9d5a completed success") break ;;
                "b03680178b0e6bfe26fe91dcae81cf1a097a9d5a completed "*) echo "Visual verification failed: $state"; exit 1 ;;
                "b03680178b0e6bfe26fe91dcae81cf1a097a9d5a "*) sleep 10 ;;
                *) echo "Unexpected visual verification run"; exit 1 ;;
              esac
            done
            [[ "$state" = *" completed success" ]]
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" artifacts/*
          gh release edit "$tag" --draft=false
