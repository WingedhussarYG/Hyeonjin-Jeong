name: Build Galactic Realms design rollback
on:
  workflow_dispatch:
  push:
    branches: [update/galactic-2.5.2-unit-designs]
    paths:
      - ".github/workflows/build-galactic-2.5.2.yml"
      - "lucid-games/updates/galactic_2_5_2.py"
permissions:
  contents: read
concurrency:
  group: galactic-realms-252-build
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the verified integrated source and restore game files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=lucid-games-2026.11.27-i18n1
          gh release download "$tag" --pattern Lucid-Games-Launcher-Source.zip --dir "$RUNNER_TEMP"
          python3 lucid-games/updates/galactic_2_5_2.py \
            --collection "$RUNNER_TEMP/Lucid-Games-Launcher-Source.zip" \
            --previous-sha256 c7151e933cb8ce179a8b140bb0af3d4ecc01ed4fd73707babe4574639c97a548 \
            --game "$RUNNER_TEMP/galactic-2.5.2-source" --source-zip galactic-2.5.2-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-2.5.2-source
          path: galactic-2.5.2-source.zip
          compression-level: 0
          if-no-files-found: error
  compile:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: galactic-2.5.2-source
      - name: Build the release using its bundled tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          unzip -q galactic-2.5.2-source.zip
          cd galactic-2.5.2-source
          sh build.sh "$TARGET"
          mkdir -p ../output
          if [ "$TARGET" = native ]; then
            cp dist/*.zip ../output/
          else
            tar -czf ../output/galactic-2.5.2-web-engine.tar.gz -C web/public game
            cp dist/galactic.wasm ../output/galactic.wasm
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-2.5.2-${{ matrix.target }}
          path: output/
          compression-level: 0
          if-no-files-found: error
  verify:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: galactic-2.5.2-*
          merge-multiple: true
      - name: Verify desktop binaries, downloads and the production portal together
        run: |
          set -euo pipefail
          unzip -q galactic-2.5.2-source.zip
          cd galactic-2.5.2-source
          mkdir -p dist
          cp ../galactic-2.5.2-windows-x64.zip ../galactic-2.5.2-linux-x64.zip ../galactic-2.5.2-macos-universal.zip ../galactic.wasm dist/
          tar xzf ../galactic-2.5.2-web-engine.tar.gz -C web/public/
          sh build.sh portal
          sh build.sh verify
          cd ..
          sha256sum galactic-2.5.2-*.zip galactic-2.5.2-web-engine.tar.gz > galactic-2.5.2-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-2.5.2-verified-release
          path: |
            galactic-2.5.2-source.zip
            galactic-2.5.2-windows-x64.zip
            galactic-2.5.2-linux-x64.zip
            galactic-2.5.2-macos-universal.zip
            galactic-2.5.2-web-engine.tar.gz
            galactic-2.5.2-checksums.txt
          compression-level: 0
          if-no-files-found: error
