name: Assemble the Lucid Games collection with Galactic Realms 2.5.2
on:
  workflow_dispatch:
  push:
    branches: [update/galactic-2.5.2-unit-designs]
    paths:
      - ".github/workflows/assemble-galactic-2.5.2.yml"
      - "lucid-games/updates/galactic_collection/**"
permissions:
  contents: read
  actions: read
concurrency:
  group: lucid-galactic-252-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download the previous verified desktop collection and development source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir previous
          gh release download lucid-games-2026.11.27-i18n1 --pattern 'Lucid-Games-*.zip' --dir previous
      - name: Wait for independently verified game binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45997485532
          sha=bc77e63ff3e0e05ffeeef9e9bb6f20ebc5c1b66e
          for i in $(seq 1 360); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '(.head_sha + " " + .status + " " + (.conclusion // "pending"))')
            case "$state" in
              "$sha completed success") exit 0 ;;
              "$sha completed "*) echo "$state"; exit 1 ;;
              "$sha "*) sleep 10 ;;
              *) echo "Unexpected verification run"; exit 1 ;;
            esac
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: galactic-2.5.2-verified-release
          github-token: ${{ github.token }}
          run-id: 45997485532
          path: candidate
      - name: Prepare the launcher module and both integrated archives
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c galactic-2.5.2-checksums.txt
          unzip -q galactic-2.5.2-source.zip
          game=galactic-2.5.2-source
          mkdir -p "$game/dist"
          cp galactic-2.5.2-{windows-x64,macos-universal,linux-x64}.zip "$game/dist/"
          tar xzf galactic-2.5.2-web-engine.tar.gz -C "$game/web/public/"
          python3 "$game/web/scripts/release-assets.py" "$PWD/$game/dist" 2.5.2
          cd ..
          python3 lucid-games/updates/galactic_collection/build_release.py all \
            --source previous/Lucid-Games-Launcher-Source.zip --bundle previous/Lucid-Games-Complete.zip \
            --new-source candidate/galactic-2.5.2-source.zip --game-public candidate/galactic-2.5.2-source/web/public \
            --out integrated --materialize
          python3 integrated/Lucid-Games-Launcher-Source.zip --verify
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ['module-record','source-result','bundle-result']:
              data=json.loads(Path('integrated',name+'.json').read_bytes())
              print('VERIFIED_'+name+'='+json.dumps(data,ensure_ascii=False,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-collection-galactic-2.5.2
          path: |
            integrated/Lucid-Games-Complete.zip
            integrated/Lucid-Games-Launcher-Source.zip
            integrated/galactic-realms-2.5.2.lgm
            integrated/catalog.json
            integrated/module-record.json
            integrated/source-result.json
            integrated/bundle-result.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
