name: Publish Lucid Studio 1.1.0 once
on:
  push:
    branches: [lucid-studio-publish-1-1-0-once]
permissions: {}
jobs:
  build:
    if: github.event.before == '371b70434f30845ad9f6da30453bbaca9430b652' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build on the release runner
        run: python3 lucid-studio/publish.py
      - name: Verify all twelve ZIPs
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          test "$(find . -name '*.zip' | wc -l)" -eq 12
          for f in *.zip; do unzip -tqq "$f"; done
          cp ../lucid-studio/README.md release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lucid-studio-1.1.0
          path: artifacts/
          retention-days: 1
          compression-level: 0
  release:
    needs: build
    if: github.event.before == '371b70434f30845ad9f6da30453bbaca9430b652' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lucid-studio-1.1.0
          path: verified
      - name: Publish this release
        working-directory: verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: WingedhussarYG/Hyeonjin-Jeong
        run: |
          gh release create lucid-studio-1.1.0 --target "$GITHUB_SHA" --title "Lucid Studio 1.1.0" --notes-file release-notes.md --draft --latest=false *.zip SHA256SUMS.txt web-editions.json
          gh release edit lucid-studio-1.1.0 --draft=false --latest=false
